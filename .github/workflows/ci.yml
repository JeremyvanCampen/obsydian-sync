name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo test --workspace
      # Builds the server binary and the bundle first; the HTTP and full-stack
      # tests drive the real binaries.
      - run: npm test
