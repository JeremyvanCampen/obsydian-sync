name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # The workspace is compiled twice otherwise — once for cargo test and
      # again for the pretest hook that builds the binaries the HTTP tests drive.
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: cargo test --workspace
      # Runs tsc via npm run build, then the whole suite including the tests
      # that drive the real server binary and the restore CLI.
      - run: npm test
